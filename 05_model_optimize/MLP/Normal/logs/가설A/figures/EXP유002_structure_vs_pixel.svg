54</text><text x="54" y="343" fill="#6b7280" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">연결 감소 − 무작위: +0.125 logit · 이미지 단위 bootstrap 95% CI [−0.145, +0.394]</text><rect x="34" y="381" width="916" height="165" rx="12" fill="#f8fafc" stroke="none"/><text x="53" y="411" fill="#1c4a80" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">② 물리적 변경량을 추가 매칭한 대조 (targeted − random)</text><line x1="465" y1="434" x2="465" y2="501" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="128" y="516" fill="#6b7280" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">-0.6</text><text x="296.5" y="516" fill="#6b7280" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">-0.3</text><text x="465" y="516" fill="#6b7280" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">0.0</text><text x="633.5" y="516" fill="#6b7280" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">0.3</text><text x="802" y="516" fill="#6b7280" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">0.6</text><line x1="206.2948101223963" y1="470" x2="600.3761836069843" y2="470" stroke="#1c4a80" stroke-width="4" /><line x1="206.2948101223963" y1="461" x2="206.2948101223963" y2="479" stroke="#1c4a80" stroke-width="2" /><line x1="600.3761836069843" y1="461" x2="600.3761836069843" y2="479" stroke="#1c4a80" stroke-width="2" /><circle cx="400.602108767877" cy="470" r="8" fill="#ed824f" stroke="white" stroke-width="2"/><text x="54" y="468" fill="#ed824f" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="650" text-anchor="start