name: EXP025 Normal MLP Batch Size Safety and Handmade Audit

on:
  push:
    branches: [exp/normal-exp025-batchsize-20261117]
    paths:
      - '.github/workflows/normal-exp025-batch-size.yml'
      - '05_model_optimize/MLP/Normal/scripts/exp025_batch_train.py'
      - '05_model_optimize/MLP/Normal/scripts/exp025_batch_aggregate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        seed: [42, 43, 44]
        batch: [32, 64, 128, 256]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned reproducibility environment
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Train with batch-size-only change on Official Train
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '05_model_optimize/MLP/Normal/scripts:05_model_optimize/MLP/Combined/scripts'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp025_batch_train.py \
            --seed ${{ matrix.seed }} --batch ${{ matrix.batch }} \
            --out "${{ runner.temp }}/EXP025-bs${{ matrix.batch }}-s${{ matrix.seed }}"
      - name: Preserve new frozen checkpoint and official-validation audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP025-bs${{ matrix.batch }}-s${{ matrix.seed }}
          path: ${{ runner.temp }}/EXP025-bs${{ matrix.batch }}-s${{ matrix.seed }}/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [train]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned reproducibility environment
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Download all 12 trained EXP025 checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: EXP025-bs*-s*
          merge-multiple: false
          path: ${{ runner.temp }}/exp025-models
      - name: Retrieve three original EXP017 frozen baseline checkpoints
        uses: actions/download-artifact@v4
        with:
          run-id: 43836257716
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: exp017-fine-s*-slot0
          merge-multiple: false
          path: ${{ runner.temp }}/exp017-frozen
      - name: Three-seed OfficialVal and shortcut gates followed by frozen Handmade 2560 audit
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '05_model_optimize/MLP/Normal/scripts:05_model_optimize/MLP/Combined/scripts'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp025_batch_aggregate.py \
            --inputs "${{ runner.temp }}/exp025-models" \
            --frozen "${{ runner.temp }}/exp017-frozen" \
            --out "${{ runner.temp }}/EXP025-final"
      - name: Upload final audit results (no model deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP025-OfficialHandmade-3Seed-GateAudit
          path: ${{ runner.temp }}/EXP025-final/
          retention-days: 30
          if-no-files-found: warn
