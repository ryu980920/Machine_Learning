name: Import provided dataset once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-provided-dataset.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the provided NPZ
        env:
          DATASET_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-4d04-8209-89bd-c8f0e16a229c/raw?se=2026-11-05T13%3A25%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=20de42d4-e92e-4a27-8f63-973ae843da7e&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T04%3A17%3A27Z&ske=2026-11-06T04%3A17%3A27Z&sks=b&skv=2026-02-06&sig=rghUqYR/gAsa9KtMseiDkOu5Z7dEcyjp2QEYfE0espk%3D'
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path("02_data/datasets/MNIST_EMNIST_official_split_112000.npz")
          target.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen(os.environ["DATASET_URL"], timeout=120) as response:
              payload = response.read()
          assert len(payload) == 22983534, "Unexpected dataset size"
          actual = hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          assert actual == "0f8a5439c791e5d2dfe74bc655ebdb39422a00cc", "Dataset hash mismatch"
          target.write_bytes(payload)
          print("Verified dataset: 22,983,534 bytes; original Git blob hash matched.")
          PY
      - name: Commit dataset and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 02_data/datasets/MNIST_EMNIST_official_split_112000.npz
          git rm -- .github/workflows/import-provided-dataset.yml
          git commit -m "data: add verified official split NPZ dataset"
          git push origin HEAD:main
