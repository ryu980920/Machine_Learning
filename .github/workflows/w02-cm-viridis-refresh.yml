name: W02 CM Viridis regeneration (review branch only)

on:
  push:
    branches:
      - chore/cm-viridis-standardization-20261115
    paths:
      - .github/workflows/w02-cm-viridis-refresh.yml
      - 03_experiments/W02_2026-11-09_11-15/scripts/standardize_all_cm.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/chore/cm-viridis-standardization-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned plotting packages
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8
      - name: Validate original stored confusion matrices
        run: python 03_experiments/W02_2026-11-09_11-15/scripts/standardize_all_cm.py --check-only
      - name: Regenerate Count and Row-normalized PNGs from CSV (no ML training)
        run: python 03_experiments/W02_2026-11-09_11-15/scripts/standardize_all_cm.py
      - name: Verify output file count
        run: |
          python - <<'PY'
          from pathlib import Path
          import matplotlib.image as mpimg
          root=Path('03_experiments/W02_2026-11-09_11-15/results')
          files=list((root/'confusion_matrices').glob('*confusion_matrix*.png'))
          files+=list((root/'EXP-유-003_rotation_v4').glob('confusion_matrix_*.png'))
          assert len(files)==30, f'Expected 30, got {len(files)}'
          for path in files:
              assert mpimg.imread(path).shape[0] > 1000, path
          print('Validated 30 PNG files.')
          PY
      - name: Commit plot-only updates to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '03_experiments/W02_2026-11-09_11-15/results/confusion_matrices/' '03_experiments/W02_2026-11-09_11-15/results/EXP-유-003_rotation_v4/'
          if ! git diff --cached --quiet; then
            git commit -m "style: regenerate W02 confusion matrices in Viridis with normalized versions"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload the resulting CM files for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W02-viridis-confusion-matrices
          path: |
            03_experiments/W02_2026-11-09_11-15/results/confusion_matrices/*confusion_matrix*.png
            03_experiments/W02_2026-11-09_11-15/results/EXP-유-003_rotation_v4/confusion_matrix_*.png
          if-no-files-found: warn
          retention-days: 30
