name: Normal EXP010-012 Size CoM Mechanism Diagnostics

on:
  push:
    branches: [exp/normal-exp010-012-geometry-causality]
    paths:
      - '.github/workflows/normal-exp010-012-mechanism.yml'
      - '05_model_optimize/MLP/Normal/scripts/exp010_geometry_distribution.py'
      - '05_model_optimize/MLP/Normal/scripts/exp011_012_causal_probes.py'
      - '05_model_optimize/MLP/Normal/scripts/exp010_012_aggregate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exp010_geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install same pinned scientific packages as EXP006 plus topology module
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Geometry distribution analysis (OfficialTrain/Val and Handmade)
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: 'Agg'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp010_geometry_distribution.py \
            --out "${{ runner.temp }}/exp010-geometry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp010-geometry
          path: ${{ runner.temp }}/exp010-geometry/
          retention-days: 30
          if-no-files-found: warn

  exp011_012_fixed_models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact previous EXP006 and topology runtime
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Download actual archived EXP006 trained checkpoints and manifests
        uses: actions/download-artifact@v4
        with:
          run-id: 43785390739
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: normal-exp006-*-${{ matrix.seed }}
          merge-multiple: false
          path: ${{ runner.temp }}/exp006-original-models
      - name: Verify original SHA/accuracies, cross-evaluate and perform size interventions
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: 'Agg'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp011_012_causal_probes.py \
            --seed "${{ matrix.seed }}" \
            --models-root "${{ runner.temp }}/exp006-original-models" \
            --out "${{ runner.temp }}/exp011-012-seed${{ matrix.seed }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp011-012-seed${{ matrix.seed }}
          path: ${{ runner.temp }}/exp011-012-seed${{ matrix.seed }}/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [exp010_geometry, exp011_012_fixed_models]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install same evaluation dependencies
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: exp01*-*
          merge-multiple: false
          path: ${{ runner.temp }}/exp010-012-inputs
      - name: Verify and aggregate all three diagnostic experiments
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: 'Agg'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp010_012_aggregate.py \
            --input-root "${{ runner.temp }}/exp010-012-inputs" \
            --out "${{ runner.temp }}/exp010-012-review"
      - uses: actions/upload-artifact@v4
        with:
          name: Normal-EXP010-012-reviewed-causal-results
          path: ${{ runner.temp }}/exp010-012-review/
          retention-days: 30
          if-no-files-found: error
