name: Apply reviewed ML04 v3 dataset once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply_ml04_v3_once.yml"

permissions:
  contents: write

jobs:
  rebuild-reviewed-v3:
    if: github.repository == 'ryu980920/Machine_Learning'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up verified Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Rebuild v3 and verify final SHA-256 before replacing the official dataset
        run: python 02_data/scripts/rebuild_ml04_v3.py
      - name: Commit corrected NPZ to the existing path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_data/datasets/MNIST_EMNIST_official_split_112000.npz
          if git diff --cached --quiet; then
            echo "Dataset already current"
          else
            git commit -m "data: replace official 112k NPZ with verified ML04 v3"
            git push origin HEAD:main
          fi
