name: Merge EXP004 Original and CoM Analysis into Single Study (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/merge_exp004_com_into_main_once.yml"

permissions:
  contents: write

jobs:
  merge-files:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout merged study logs and original research outputs
        uses: actions/checkout@v4

      - name: Move 9 original CoM analysis files into EXP004 result folder and remove duplicate log
        shell: bash
        run: |
          set -euo pipefail
          root="05_model_optimize/MLP/Normal"
          parent="$root/results/Automatic_Centering"
          old="$parent/CoM_Decision_Review"
          test -f "$parent/README.md"
          test -f "$root/logs/EXP유004_Automatic_Centering.md"
          test -f "$old/README.md"
          test -f "$root/logs/EXP유004_CoM_판단근거_후속분석.md"
          for f in four_way_summary.csv contrasts.csv four_way_predictions.csv pairwise_margins.csv selected_ig_diagnostics.csv IG_5_wrong_F_to_5.png IG_B_correct_to_wrong_8.png; do
            test -f "$old/$f"
            test ! -e "$parent/$f"
            git mv "$old/$f" "$parent/$f"
          done
          test ! -e "$parent/CoM_Decision_SUMMARY.md"
          test ! -e "$parent/CoM_Decision_metadata.json"
          git mv "$old/SUMMARY.md" "$parent/CoM_Decision_SUMMARY.md"
          git mv "$old/metadata.json" "$parent/CoM_Decision_metadata.json"
          git rm "$old/README.md"
          git rm "$root/logs/EXP유004_CoM_판단근거_후속분석.md"

      - name: Verify original 19 result files byte-for-byte, index links, and single EXP004 log
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path("05_model_optimize/MLP/Normal")
          p=root/"results"/"Automatic_Centering"
          checks={
            "SUMMARY.md":"a218e64f267a79bdab5f9924812db96215db86257775176858fa6a7c3a96cfdf",
            "accuracy_comparison.png":"64201b7036cf3df1c7ec4634340056f83e72d6100907d398ea224743de9e0e64",
            "exp004_alignment_stats.csv":"66ff7aa03dd341c8acdccc0b556af614b87b91b0149b07ecacd1f9ea9cb0654c",
            "exp004_bbox.joblib":"09976f913cf48046f5782d9915bae031e957367da40048ab470afb6a82feb362",
            "exp004_confusions.csv":"5bf4cfd74f97f5aefff9c829f665790acdc9399c8425ac7bdaefe68e3293d966",
            "exp004_group_metrics.csv":"1810fa279353d3c2c42ee0331b633123c4b4f19241e4f5e71e5aa8a614f022bd",
            "exp004_mass.joblib":"3c1aac362d75ff5c4d9652188c1c4fd97524525f5409ec00d5a6c56fa3ad27ef",
            "exp004_predictions.csv.gz":"0dbdbe369a73a037cd192896f20a94b4cbb361f981540c9a4ae7d9cb73eaf613",
            "exp004_run_metadata.json":"265899d0c35df749e7c58b31b0ed9181f940d69e9d72d10115824e2d6bed5f58",
            "exp004_typical_confusions.csv":"ff5607175a056bd02d4aa7ba1ccd829132b6913859d60821cf1abe7bd7def355",
            "IG_5_wrong_F_to_5.png":"84d6bfffc5d42cda41088dd5b1323bd88ca0b2dc0951f0555cfdab3434f6464f",
            "IG_B_correct_to_wrong_8.png":"9f7e905af3cce09fa50b709fc18f483de4de36fb1aa01729e3794ad352068e50",
            "CoM_Decision_SUMMARY.md":"bfb44d9f73a97caaee3d3827ed43368dcd881c4e337707742cb0524288fe5598",
            "contrasts.csv":"22b67fd77ba45d6e097c6c8600141989a2ad8ca7468d57afaff0455c3840aff4",
            "four_way_predictions.csv":"723ce660eeba09ff70af8d4de001e0e54d42bfac8fe02a8c01a758582e17c1af",
            "four_way_summary.csv":"d91c241d1d543dfd7891958e50138f878888c21558a27f54a775260223ae6952",
            "CoM_Decision_metadata.json":"e7f99ebdd99d5c5ecfa562801c610e462e6ebb62acfaf0a54eb453867dc71775",
            "pairwise_margins.csv":"0c885c59bc8383691a6fedbf59786a6e0c4a4298967a6029c41da4690a5102e0",
            "selected_ig_diagnostics.csv":"7f14a8f077301f31469f392c97f56c475c82e1e6b9d2662c078e44f966a51e92",
          }
          assert len(checks)==19
          for name, sha in checks.items():
            file=p/name
            assert file.is_file(),f"Missing {name}"
            with file.open("rb") as f:
              actual=hashlib.file_digest(f,"sha256").hexdigest()
            assert actual==sha,f"Hash mismatch {name}: {actual}"
          files={a.name for a in p.iterdir() if a.is_file()}
          assert files==set(checks)|{"README.md"},sorted(files^set(checks)|{"README.md"})
          assert not (p/"CoM_Decision_Review").exists()
          assert (root/"logs"/"EXP유004_Automatic_Centering.md").is_file()
          assert not (root/"logs"/"EXP유004_CoM_판단근거_후속분석.md").exists()
          for f in [root/"README.md",root/"logs"/"README.md",root/"results"/"README.md",
                    root/"scripts"/"README.md",root/"logs"/"EXP유004_Automatic_Centering.md",
                    p/"README.md"]:
            body=f.read_text(encoding="utf-8")
            assert "CoM_Decision_Review/" not in body,f"stale link in {f}"
            assert "EXP유004_CoM_판단근거_후속분석.md" not in body,f"stale log link in {f}"
          with (p/"four_way_summary.csv").open(encoding="utf-8-sig",newline="") as f:
            rs=list(csv.DictReader(f))
          def r(group,cond):
            s=[x for x in rs if x["group"]==group and x["condition"]==cond]
            assert len(s)==1,(group,cond)
            return s[0]
          for group,cond,count,n in [
            ("all","Normal_raw",1609,2560),
            ("all","Normal_CoM",1815,2560),
            ("all","CoMModel_CoM",1974,2560),
            ("digits_0-9","Normal_raw",901,1600),
            ("digits_0-9","Normal_CoM",1312,1600),
            ("digits_0-9","CoMModel_CoM",1331,1600),
            ("letters_A-F","Normal_raw",708,960),
            ("letters_A-F","Normal_CoM",503,960),
            ("letters_A-F","CoMModel_CoM",643,960),
          ]:
            row=r(group,cond)
            assert int(row["correct"])==count and int(row["n"])==n
            assert abs(float(row["accuracy"])-count/n)<1e-12
          with (p/"four_way_predictions.csv").open(encoding="utf-8-sig",newline="") as f:
            perimage=list(csv.DictReader(f))
          assert len(perimage)==2560
          assert len({(r["writer"],r["index"]) for r in perimage})==2560
          print("PASS: ONE EXP004 log, ONE result directory, 19 original files byte-perfect, "
                "2560 paired rows and all 3-condition accuracies confirmed")
          PY

      - name: Commit single unified EXP004 research artifact
        shell: bash
        run: |
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unify EXP유004 CoM evaluation and pixel decision analysis into one log and results directory"
          git pull --rebase origin main
          git push origin HEAD:main
