name: EXP004 Normal MLP Automatic Centering Review (no publication)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mlp_exp004_automatic_centering_review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp004:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact experiment script and current official data
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install identical sklearn/scientific baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "scikit-learn==1.8.0" "matplotlib==3.10.7"

      - name: Execute original vs Center of Mass vs Bounding Box MLPs (review only)
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
          MPLBACKEND: "Agg"
        run: |
          python 05_model_optimize/MLP/Normal/scripts/Automatic_Centering_Experiment.py \
            --out "$RUNNER_TEMP/normal_mlp_exp004_centering_review"

      - name: Store all measured results, diagnostics and candidate checkpoints (NO commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-mlp-exp004-automatic-centering-review
          path: ${{ runner.temp }}/normal_mlp_exp004_centering_review/
          retention-days: 30
          if-no-files-found: warn
