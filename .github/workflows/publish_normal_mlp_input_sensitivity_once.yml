name: Publish Verified Normal MLP Stage 3 Results (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish_normal_mlp_input_sensitivity_once.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish-stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with approved EXP-유002 log and scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download the verified original Stage 3 artifact, not a rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43629898144 \
            --repo "${{ github.repository }}" \
            --name normal-mlp-input-sensitivity-stage3 \
            --dir 05_model_optimize/MLP/Normal/results/Input_Sensitivity

      - name: Verify exact source data and prediction counts
        shell: bash
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          p=Path("05_model_optimize/MLP/Normal/results/Input_Sensitivity")
          original={"SUMMARY.md","normal_mlp_refit_stage3.joblib",
                    "stage3_error_pairs.csv","stage3_example_grid.png",
                    "stage3_focus_106.csv","stage3_per_class.csv",
                    "stage3_per_writer.csv","stage3_predictions.csv.gz",
                    "stage3_probability_curves.png","stage3_run_metadata.json",
                    "stage3_sensitivity_summary.csv"}
          missing=[x for x in original if not (p/x).is_file()]
          assert not missing, f"Missing artifact files: {missing}"
          d=json.loads((p/"stage3_run_metadata.json").read_text())
          assert d["official_test_read"] is False
          assert d["handmade_training"] is False
          assert d["model_hyperparameters_modified"] is False
          assert d["official_n"]==19200 and d["handmade_n"]==2560
          assert d["total_prediction_rows"]==456960
          assert d["focus_n"]==106 and d["focus_rows"]==2226
          assert d["baseline_validation_cm_L1_difference"]==0
          assert d["baseline_handmade_prediction_difference"]==0
          assert d["stage12_focus_changed_prediction_count"]==0
          assert abs(d["original_accuracy"]["OfficialVal"]-0.9731770833333333)<1e-12
          assert abs(d["original_accuracy"]["Handmade"]-0.628515625)<1e-12
          for name,count in [("stage3_sensitivity_summary.csv",42),
                             ("stage3_per_class.csv",672),("stage3_per_writer.csv",84),
                             ("stage3_error_pairs.csv",546),("stage3_focus_106.csv",2226)]:
              with (p/name).open(encoding="utf-8-sig",newline="") as f:
                  assert sum(1 for _ in csv.DictReader(f))==count, name
          with gzip.open(p/"stage3_predictions.csv.gz",mode="rt") as f:
              assert sum(1 for _ in f)==456961, "Prediction CSV row count mismatch"
          print("Verified ORIGINAL success-run artifact and 456,960 predictions")
          PY

      - name: Recreate review plots from verified CSV
        run: |
          python -m pip install "numpy>=1.26,<3" "matplotlib>=3.8,<4"
          python 05_model_optimize/MLP/Normal/scripts/plot_input_sensitivity.py \
            --result-dir 05_model_optimize/MLP/Normal/results/Input_Sensitivity

      - name: Commit approved complete Stage 3 outputs
        run: |
          git add -- 05_model_optimize/MLP/Normal/results/Input_Sensitivity/
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Stage 3 results already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish verified EXP유002 Normal MLP Input_Sensitivity results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
