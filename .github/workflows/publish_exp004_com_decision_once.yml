name: Publish Verified EXP004 CoM Decision Follow-up (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish_exp004_com_decision_once.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source and approved EXP004 log
        uses: actions/checkout@v4

      - name: Retrieve original successful CoM pixel-decision review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43686466736 --repo "$GITHUB_REPOSITORY" \
            --name exp004-com-pixel-decision-review \
            --dir 05_model_optimize/MLP/Normal/results/Automatic_Centering/CoM_Decision_Review

      - name: Verify all 9 original files, 2,560 source predictions and recorded contrasts
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path("05_model_optimize/MLP/Normal/results/Automatic_Centering/CoM_Decision_Review")
          checks={
            "IG_5_wrong_F_to_5.png":"84d6bfffc5d42cda41088dd5b1323bd88ca0b2dc0951f0555cfdab3434f6464f",
            "IG_B_correct_to_wrong_8.png":"9f7e905af3cce09fa50b709fc18f483de4de36fb1aa01729e3794ad352068e50",
            "SUMMARY.md":"bfb44d9f73a97caaee3d3827ed43368dcd881c4e337707742cb0524288fe5598",
            "contrasts.csv":"22b67fd77ba45d6e097c6c8600141989a2ad8ca7468d57afaff0455c3840aff4",
            "four_way_predictions.csv":"723ce660eeba09ff70af8d4de001e0e54d42bfac8fe02a8c01a758582e17c1af",
            "four_way_summary.csv":"d91c241d1d543dfd7891958e50138f878888c21558a27f54a775260223ae6952",
            "metadata.json":"e7f99ebdd99d5c5ecfa562801c610e462e6ebb62acfaf0a54eb453867dc71775",
            "pairwise_margins.csv":"0c885c59bc8383691a6fedbf59786a6e0c4a4298967a6029c41da4690a5102e0",
            "selected_ig_diagnostics.csv":"7f14a8f077301f31469f392c97f56c475c82e1e6b9d2662c078e44f966a51e92",
          }
          for name,expected in checks.items():
            assert (p/name).is_file(),name
            with (p/name).open("rb") as f:
              got=hashlib.file_digest(f,"sha256").hexdigest()
            assert got==expected,(name,got)
          counts={"contrasts.csv":28,"four_way_predictions.csv":2560,
                  "four_way_summary.csv":28,"pairwise_margins.csv":8,
                  "selected_ig_diagnostics.csv":21}
          def csvrows(name):
            with (p/name).open("r",encoding="utf-8-sig",newline="") as f:
              return list(csv.DictReader(f))
          for name,n in counts.items():
            assert len(csvrows(name))==n,(name,len(csvrows(name)))
          m=json.loads((p/"metadata.json").read_text(encoding="utf-8"))
          assert m["study"]=="EXP유004 CoM pixel decision diagnostic"
          assert m["handmade_n"]==2560
          assert m["official_test_read"] is False
          assert m["professor_test_read"] is False
          assert m["model_fit_performed"] is False
          assert m["new_preprocessing_parameter_search"] is False
          assert m["models_sha256"]["Normal"]=="9b54ba9c60e389575200d88ad0b93c47ec47f9c673eebeb755ff47e3ebe23b0a"
          assert m["models_sha256"]["CoM"]=="3c1aac362d75ff5c4d9652188c1c4fd97524525f5409ec00d5a6c56fa3ad27ef"
          summ=csvrows("four_way_summary.csv")
          expect={
            ("all","Normal_raw"):(1609,2560),
            ("all","Normal_CoM"):(1815,2560),
            ("all","CoMModel_CoM"):(1974,2560),
            ("digits_0-9","Normal_raw"):(901,1600),
            ("digits_0-9","Normal_CoM"):(1312,1600),
            ("digits_0-9","CoMModel_CoM"):(1331,1600),
            ("letters_A-F","Normal_raw"):(708,960),
            ("letters_A-F","Normal_CoM"):(503,960),
            ("letters_A-F","CoMModel_CoM"):(643,960),
          }
          for (group,cond),(correct,n) in expect.items():
            rows=[x for x in summ if x["group"]==group and x["condition"]==cond]
            assert len(rows)==1,(group,cond)
            x=rows[0]
            assert (int(x["correct"]),int(x["n"]))==(correct,n),(group,cond,x)
            assert abs(float(x["accuracy"])-correct/n)<1e-12,(group,cond)
          predictions=csvrows("four_way_predictions.csv")
          assert len({(x["writer"],x["index"]) for x in predictions})==2560
          assert len(predictions)==2560
          print("Verified 9 original SHA-256 files, 2,560 unique Handmade rows, "
                "28 + 28 summary/contrast rows, 21 IG rows, no training/Test.")
          PY

      - name: Commit original approved EXP004 follow-up only
        run: |
          git add -- 05_model_optimize/MLP/Normal/results/Automatic_Centering/CoM_Decision_Review/
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Original EXP004 CoM follow-up outputs already published."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish verified EXP유004 CoM decision and pixel-IG follow-up outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
