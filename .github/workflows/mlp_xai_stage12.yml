name: Normal MLP XAI - stages 1 and 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mlp_xai_stage12.yml
      - 03_experiments/model_optimization/mlp_xai_stage12.py

permissions:
  contents: read

jobs:
  mlp-xai:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout existing repository data and code
        uses: actions/checkout@v4

      - name: Set up original Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install original baseline numerical libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "scikit-learn==1.8.0" "matplotlib==3.10.7"

      - name: Refit unchanged Normal MLP and calculate Stage 1-2 XAI
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
          MPLBACKEND: "Agg"
        run: |
          python 03_experiments/model_optimization/mlp_xai_stage12.py \
            --out "${{ runner.temp }}/mlp_xai_stage12_results"

      - name: Upload Stage 1-2 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-mlp-xai-stage12
          path: ${{ runner.temp }}/mlp_xai_stage12_results/
          retention-days: 30
          if-no-files-found: warn
