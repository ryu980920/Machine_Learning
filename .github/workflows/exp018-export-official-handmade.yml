name: EXP019 exact official 76800 training source snapshot
on:
  push:
    branches: [audit/exp018-official2560-dataset-20261117]
    paths: ['.github/workflows/exp018-export-official-handmade.yml']
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact standardized NPZ bytes from repository
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          expected={41:165418,42:133574,43:124939,44:123303}
          for writer,size in expected.items():
              p=pathlib.Path(f'02_data/Hand_made/ml26_{writer}.npz')
              assert p.exists() and p.stat().st_size==size,(writer,p.exists(),p.stat().st_size if p.exists() else None)
              assert zipfile.is_zipfile(p)
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'OFFICIAL_SOURCE writer={writer} byte_count={size} sha256={sha}',flush=True)
          PY
      - name: Verify final v3 official dataset exact bytes
        run: |
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('02_data/datasets/MNIST_EMNIST_official_split_112000.npz')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='0e9570d0eb04c0c1da99d043b85bfdab7f3b639eebe4b10335b05b57ad671879'
          assert digest==expected,(digest,expected)
          print('VERIFIED_OFFICIAL_V3_SHA',digest,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP019-ExactOfficialV3-SourceNPZ
          path: 02_data/datasets/MNIST_EMNIST_official_split_112000.npz
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: EXP018-OfficialHandmade2560-GitHubMainNPZ
          path: |
            02_data/Hand_made/ml26_41.npz
            02_data/Hand_made/ml26_42.npz
            02_data/Hand_made/ml26_43.npz
            02_data/Hand_made/ml26_44.npz
          if-no-files-found: error
          retention-days: 5
