name: EXP-CMB-007 Publish Verified Results Artifact (No Retraining or Reaggregation)

on:
  push:
    branches: [exp/cmb007-size60to100-shortcut-audit-20261116]
    paths:
      - '.github/workflows/exp-cmb-007-commit-verified-results.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  commit_verified:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/cmb007-size60to100-shortcut-audit-20261116
          persist-credentials: true
      - name: Download fully verified 31-condition results artifact (no fitting)
        uses: actions/download-artifact@v4
        with:
          name: EXP-CMB-007-all-60to100-results-vs-31-arm-history
          run-id: 43898638558
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: 05_model_optimize/MLP/Combined/results/Balanced_Scale_Stroke_HighFraction
      - name: Verify artifact content and no-test/hyperparameter audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          root=Path("05_model_optimize/MLP/Combined/results/Balanced_Scale_Stroke_HighFraction")
          new=root/"stage_high_60to100"
          allc=root/"full_0to100_comparison"
          m=json.loads((new/"manifest.json").read_text(encoding="utf-8"))
          n=json.loads((allc/"manifest.json").read_text(encoding="utf-8"))
          assert m["experiment"]=="EXP-CMB-007" and m["expected_fits"]==180
          assert m["no_hp_search"] and m["no_test_used"] and m["frozen_mlp_parameters"]
          assert (n["old_condition_count"],n["new_condition_count"],n["total_condition_count"],n["expected_new_fits"])==(16,15,31,180)
          assert not n["hyperparameters_changed"] and not n["original_test_used"] and not n["professor_test_used"]
          expected={
            new/"comparison.csv":15,
            new/"per_seed_overall.csv":45,
            new/"all_240_direction_changes.csv":15*240,
            new/"all_16_class_error_changes.csv":15*16,
            allc/"all_31_preprocessing_conditions.csv":31,
            allc/"all_240_directed_errors_across_31_conditions.csv":31*240,
            allc/"all_16_class_error_rates_across_31_conditions.csv":31*16,
            allc/"all_31_condition_16class_five_scale_flip.csv":31*2*16*5,
            allc/"all_31_condition_16class_worst_flip.csv":31*2,
            allc/"all_240_pair_changes_vs_30_50.csv":4*15*240,
            allc/"paired_30_50_vs_60_100_corrections.csv":4*15*3
          }
          for file,count in expected.items():
              assert file.is_file(),file
              with file.open(encoding="utf-8-sig",newline="") as f:
                  observed=sum(1 for _ in csv.DictReader(f))
              assert observed==count,(str(file),observed,count)
              print(file,observed)
          assert (new/"SUMMARY.md").is_file() and (allc/"SUMMARY.md").is_file()
          print("RESULTS_VERIFIED_FROM_ORIGINAL_SUCCESSFUL_ARTIFACT")
          PY
      - name: Commit verified results to up-to-date experiment branch (no force)
        run: |
          set -euo pipefail
          branch="exp/cmb007-size60to100-shortcut-audit-20261116"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 05_model_optimize/MLP/Combined/results/Balanced_Scale_Stroke_HighFraction/
          if git diff --staged --quiet; then
            echo "All verified results already present on branch"
            exit 0
          fi
          git commit -m 'research: archive EXP-CMB-007 verified 180 fits and full 31-arm diagnostics [skip ci]'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
