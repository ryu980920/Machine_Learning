name: Normal EXP017 Coarse Saved-Artifact Aggregate Only

on:
  push:
    branches: [exp/normal-exp017-80-14-mlp-hparam-20261116]
    paths:
      - '.github/workflows/normal-exp017-coarse-aggregate-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned scientific environment
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Download 9 immutable successful training shards, no refit
        uses: actions/download-artifact@v4
        with:
          run-id: 43833188106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: exp017-coarse-s*-p*
          merge-multiple: false
          path: ${{ runner.temp }}/exp017-coarse-all
      - name: Aggregate preserved 26 configurations 3 seeds with fixed summary field
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp017_hparam_coarse_aggregate.py \
            --inputs '${{ runner.temp }}/exp017-coarse-all' \
            --out '${{ runner.temp }}/exp017-coarse-ranked'
      - uses: actions/upload-artifact@v4
        with:
          name: EXP017-OfficialVal-26config-coarse-3seed-review
          path: ${{ runner.temp }}/exp017-coarse-ranked/
          retention-days: 30
          if-no-files-found: error
