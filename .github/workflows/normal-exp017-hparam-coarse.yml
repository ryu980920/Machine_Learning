name: Normal EXP017 80-14 MLP HP Coarse OfficialVal Only

on:
  push:
    branches: [exp/normal-exp017-80-14-mlp-hparam-20261116]
    paths:
      - '.github/workflows/normal-exp017-hparam-coarse.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        seed: [42, 43, 44]
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned training dependencies
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Reproduce frozen EXP016 80-14 image augmentation and run selected HP matrix
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp017_hparam_coarse.py \
            --seed '${{ matrix.seed }}' \
            --part '${{ matrix.part }}' \
            --out '${{ runner.temp }}/exp017-coarse-s${{ matrix.seed }}-p${{ matrix.part }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp017-coarse-s${{ matrix.seed }}-p${{ matrix.part }}
          path: ${{ runner.temp }}/exp017-coarse-s${{ matrix.seed }}-p${{ matrix.part }}/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [train]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned training dependencies
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Download all 9 coarse study training shards
        uses: actions/download-artifact@v4
        with:
          pattern: exp017-coarse-s*-p*
          merge-multiple: false
          path: ${{ runner.temp }}/exp017-coarse-all
      - name: Rank all 26 HP configurations with 3-seed OfficialVal gates
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          python 05_model_optimize/MLP/Normal/scripts/exp017_hparam_coarse_aggregate.py \
            --inputs '${{ runner.temp }}/exp017-coarse-all' \
            --out '${{ runner.temp }}/exp017-coarse-ranked'
      - uses: actions/upload-artifact@v4
        with:
          name: EXP017-OfficialVal-26config-coarse-3seed-review
          path: ${{ runner.temp }}/exp017-coarse-ranked/
          retention-days: 30
          if-no-files-found: error
