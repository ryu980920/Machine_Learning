name: EXP-CMB-011 Classwise handwriting additions and matched controls

on:
  push:
    branches:
      - exp/cmb011-classwise-addition-20261119
    paths:
      - .github/workflows/exp-cmb011-classwise-addition.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: exp-cmb011-classwise
  cancel-in-progress: false

jobs:
  folds:
    name: CMB011 ${{ matrix.arm }} seed${{ matrix.seed }} writer${{ matrix.writer }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        arm: [base, add79, addB8, add480, dup79, dupB8, dup480]
        seed: [42, 43, 44]
        writer: [41, 42, 43, 44]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin experiment requirements
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Verify original handwritten NPZ and compile experiment scripts
        run: |
          python -m py_compile 05_model_optimize/MLP/Combined/scripts/exp_cmb011_classwise_training.py 05_model_optimize/MLP/Combined/scripts/exp_cmb011_aggregate.py
          python - <<'PY'
          import hashlib,pathlib,sklearn
          p=pathlib.Path("02_data/Hand_made_extra/CMB010_7_8_9_B_480.npz")
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="3d1686c67d7bb5c6193384eca1aa9218213c842252baa5b7e172698743b83fc7"
          assert sklearn.__version__=="1.8.0"
          print("CMB011_QA_OK",p.stat().st_size,sklearn.__version__)
          PY
      - name: Fit single writer-held-out fold
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          python 05_model_optimize/MLP/Combined/scripts/exp_cmb011_classwise_training.py --arm "${{ matrix.arm }}" --seed "${{ matrix.seed }}" --heldout "${{ matrix.writer }}" --out "${{ runner.temp }}/fits/cmb011-${{ matrix.arm }}-s${{ matrix.seed }}-w${{ matrix.writer }}"
      - name: Preserve predictions manifest and candidate model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmb011-${{ matrix.arm }}-s${{ matrix.seed }}-w${{ matrix.writer }}
          path: ${{ runner.temp }}/fits/cmb011-${{ matrix.arm }}-s${{ matrix.seed }}-w${{ matrix.writer }}/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

  aggregate:
    name: CMB011 84-fold aggregate and classwise evidence
    needs: folds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install metric requirements
        run: python -m pip install -r 05_model_optimize/MLP/Normal/scripts/EXP007_requirements.txt
      - name: Retrieve exactly 84 model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cmb011-*-s*
          path: ${{ runner.temp }}/incoming
          merge-multiple: false
      - name: Recompute Precision Recall F1 and paired directions
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python 05_model_optimize/MLP/Combined/scripts/exp_cmb011_aggregate.py --incoming "${{ runner.temp }}/incoming" --out "${{ runner.temp }}/report"
      - name: Upload final complete reproducibility audit
        uses: actions/upload-artifact@v4
        with:
          name: cmb011-classwise-84fit-aggregate
          path: ${{ runner.temp }}/report/
          retention-days: 30
          if-no-files-found: error
